# Aggiorna la pagina da solo e la pubblica su GitHub Pages (apribile dal telefono).
name: Aggiorna cartellini
on:
  schedule:
    - cron: "*/20 8-22 * * *"   # ogni 20 minuti, dalle 10 alle 24 ora italiana (orario UTC)
  workflow_dispatch: {}          # pulsante "Run workflow" per aggiornare subito a mano
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Ripristina dati salvati (archivio arbitri e cache)
        uses: actions/cache@v4
        with:
          path: dati
          key: dati-${{ github.run_id }}
          restore-keys: dati-
      - run: pip install pandas requests python-dateutil
      - name: Chiave API-Football
        run: echo "APIFOOTBALL_KEY=${{ secrets.APIFOOTBALL_KEY }}" > .env
      - run: python aggiorna.py
      - name: Controlla la password della pagina
        id: pw
        env:
          PW: ${{ secrets.PAGINA_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::warning::Manca il secret PAGINA_PASSWORD: non pubblico nulla (resta online l'ultima versione)."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.pw.outputs.ok == 'si'
        with: { node-version: "20" }
      - name: Cifra la pagina con la password
        if: steps.pw.outputs.ok == 'si'
        env:
          PW: ${{ secrets.PAGINA_PASSWORD }}
        run: |
          mkdir site
          npx -y staticrypt@3.5.4 index.html -p "$PW" -d site --short --remember 30 \
            --template-title "Cartellini Serie A" \
            --template-instructions "Pagina privata: inserisci la password che ti è stata data." \
            --template-button "Entra" --template-placeholder "Password" \
            --template-error "Password errata" --template-remember "Ricordami su questo dispositivo"
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          test -s site/index.html && ! grep -q "Tremolada" site/index.html && echo "Pagina cifrata correttamente"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pw.outputs.ok == 'si'
        with: { path: site }
      - id: deploy
        if: steps.pw.outputs.ok == 'si'
        uses: actions/deploy-pages@v4
