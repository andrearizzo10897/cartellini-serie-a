# Aggiorna la pagina da solo e la pubblica su GitHub Pages (apribile dal telefono).
name: Aggiorna cartellini
on:
  schedule:
    - cron: "*/10 8-22 * * *"   # richiesto ogni 10 minuti, ma dall'8/11/2026 GitHub lo avvia solo 2-3 volte al giorno: serve solo a far ripartire la catena del job «prossimo» se si interrompe
  workflow_dispatch: {}          # pulsante "Run workflow" per aggiornare subito a mano
  push:                          # ogni invio di quote dal PC (ogni 20 minuti con Avvia acceso) aggiorna subito la pagina online
    paths: [quote_daznbet.json, formazioni_ufficiali.json]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write     # per far ripartire il workflow da solo prima delle partite (job «prossimo»)
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      richiama: ${{ steps.dati.outputs.richiama }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Ripristina dati salvati (archivio arbitri e cache)
        uses: actions/cache@v4
        with:
          path: dati
          key: dati-${{ github.run_id }}
          restore-keys: dati-
      - run: pip install -r requirements.txt
      - name: Chiave API-Football
        run: echo "APIFOOTBALL_KEY=${{ secrets.APIFOOTBALL_KEY }}" > .env
      - id: dati
        run: python aggiorna.py
      - name: Controlla la password della pagina
        id: pw
        env:
          PW: ${{ secrets.PAGINA_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::warning::Manca il secret PAGINA_PASSWORD: non pubblico nulla (resta online l'ultima versione)."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.pw.outputs.ok == 'si'
        with: { node-version: "20" }
      - name: Cifra la pagina con la password
        if: steps.pw.outputs.ok == 'si'
        env:
          PW: ${{ secrets.PAGINA_PASSWORD }}
        run: |
          mkdir site
          npx -y staticrypt@3.5.4 index.html -p "$PW" -d site --remember 30 \
            --template-title "Cartellini Serie A" \
            --template-instructions "Pagina privata: inserisci la password che ti è stata data." \
            --template-button "Entra" --template-placeholder "Password" \
            --template-error "Password errata" --template-remember "Ricordami su questo dispositivo"
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          test -s site/index.html && ! grep -q "Tremolada" site/index.html && echo "Pagina cifrata correttamente"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pw.outputs.ok == 'si'
        with: { path: site }
      # Pages a volte risponde «Deployment failed, try again later» (21/11/2026: pagina online ferma 3 ore): si riprova dopo un minuto
      - id: deploy
        if: steps.pw.outputs.ok == 'si'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.pw.outputs.ok == 'si' && steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.pw.outputs.ok == 'si' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
  # Dall'8/11/2026 il cron di GitHub parte solo 2-3 volte al giorno: ogni giro fa ripartire il successivo, senza PC e senza
  # token esterni. Dalle 10 a mezzanotte (ora italiana) dopo ~15 minuti, ~7 se una partita entro 2 ore non ha le ufficiali;
  # di notte aspetta fino alle 10 (al massimo 5 ore e mezza per volta). Un invio dal PC o il cron annullano il giro in corso
  # (concurrency) e la catena prosegue da quello nuovo: ne resta sempre una sola. Con !cancelled() un giro annullato non riparte.
  prossimo:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Attesa prima del prossimo giro
        env:
          RICHIAMA: ${{ needs.build.outputs.richiama }}
        run: |
          ora=$(TZ=Europe/Rome date +%-H)
          if [ "$ora" -ge 10 ]; then
            if [ "$RICHIAMA" = "si" ]; then attesa=420; else attesa=840; fi
          else
            attesa=$(( $(TZ=Europe/Rome date -d "today 10:00" +%s) - $(date +%s) ))
            [ "$attesa" -gt 19800 ] && attesa=19800
            [ "$attesa" -lt 60 ] && attesa=60
          fi
          echo "Ora italiana $ora: il prossimo giro parte tra $attesa secondi"
          sleep "$attesa"
      - run: gh workflow run aggiorna.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
